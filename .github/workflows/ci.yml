name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      # The first apply runs the release before, so the second one is an
      # upgrade: the seed has already run, and Home Assistant migrates its
      # own database and settings as the new image starts.
      - name: Apply 2026.10.4, then upgrade to the default release
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve -var homeassistant_version=2026.10.4 -var image_digest=sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
          conn3x apply -auto-approve
      - name: Plan again with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      # Finishes onboarding through the API, signs in as the new owner,
      # refuses a wrong password, reads /api/config with the token and checks
      # it runs the upgraded release, and checks port 8123 doesn't answer on
      # the host's own address.
      - name: Onboard, sign in, check the version and the listen address
        working-directory: examples/local
        run: sudo podman exec -i -e WANT_VERSION=2026.11.0 circuit-homeassistant sh < check.sh
      # Restarting the container boots systemd again, so this checks the
      # service is enabled and the owner and HTTP settings live on the host.
      - name: Restart the host, then sign in again
        working-directory: examples/local
        run: |
          sudo podman restart circuit-homeassistant
          for _ in $(seq 90); do
            case $(sudo podman exec circuit-homeassistant systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i -e WANT_VERSION=2026.11.0 circuit-homeassistant sh < check.sh
      - name: Plan again after the restart
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: Check only root can enter the config's parent
        run: '[ "$(sudo podman exec circuit-homeassistant stat -c "%u %a" /var/lib/homeassistant)" = "0 700" ]'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
